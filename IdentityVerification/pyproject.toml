[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecomotion-identity-verification"
version = "0.1.0"
description = "Identity verification service for EcoMotion"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.18,<1",
    "Pillow>=10.4,<13",
    "mediapipe>=0.10.20,<0.11",
    "numpy>=1.26,<3",
    "onnxruntime>=1.20,<2",
    "scikit-image>=0.26,<1",
    "av>=16,<20",
    "pydantic-settings>=2.6,<3",
]

[tool.setuptools.packages.find]
where = ["src"]