# Test configuration.
#
# This file shadows src/main/resources/application.properties on the test classpath, so the test
# suite runs against an in-memory H2 database and never touches a developer's PostgreSQL data.
spring.application.name=EcoMotion

# ===============================
# Database (in-memory H2)
# ===============================
spring.datasource.url=jdbc:h2:mem:ecomotion-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.data.jpa.repositories.enabled=true

# ===============================
# JWT (secret must be >= 32 bytes)
# ===============================
app.jwt.secret=test-secret-key-for-unit-and-integration-tests-32bytes
app.jwt.access-token-ttl=15m
app.jwt.issuer=ecomotion

# ===============================
# Refresh token
# ===============================
app.refresh-token.ttl-remember-me=7d
app.refresh-token.ttl-default=1d

# ===============================
# Cookie
# ===============================
app.cookie.name=refresh_token
app.cookie.path=/api/auth
app.cookie.secure=false
app.cookie.same-site=Lax

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ===============================
# SpringDoc / Swagger (kept enabled so the API docs contract is testable)
# ===============================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.fptufa26.ecomotion
