# Test configuration.
#
# This file shadows src/main/resources/application.properties on the test classpath, so the test
# suite runs against an in-memory H2 database and never touches a developer's PostgreSQL data.
spring.application.name=EcoMotion

# ===============================
# Spring profile
# ===============================
# `test` registers the test-only beans (MockEkycService) without activating the `dev` profile,
# which would also switch on DevDataSeeder and seed rows into every integration test.
spring.profiles.active=test

# ===============================
# Database (in-memory H2)
# ===============================
spring.datasource.url=jdbc:h2:mem:ecomotion_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.data.jpa.repositories.enabled=true

# ===============================
# JWT (secret must be >= 32 bytes)
# ===============================
app.jwt.secret=test-secret-key-for-unit-and-integration-tests-32bytes
app.jwt.access-token-ttl=15m
app.jwt.issuer=ecomotion
app.crypto.secret=test-crypto-secret-0123456789abcdef-32bytes

# ===============================
# Refresh token
# ===============================
app.refresh-token.ttl-remember-me=7d
app.refresh-token.ttl-default=1d

# ===============================
# Cookie
# ===============================
app.cookie.name=refresh_token
app.cookie.path=/api/auth
app.cookie.secure=false
app.cookie.same-site=Lax

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ===============================
# Registration / OTP / eKYC
# ===============================
# Tests never hit the network: force the logging OTP provider regardless of the main config.
app.registration-token.ttl=30m
app.otp.provider=logging
app.otp.length=6
app.otp.ttl=5m
app.otp.max-attempts=5
app.otp.resend-cooldown=60s
# Tests need to read the generated code to drive the verify step. The UI never shows it.
app.otp.expose-in-response=true
app.ekyc.provider=mock
app.ekyc.mock.force-fail=false
app.password.min-length=8

# Activation (post-registration)
app.activation-token.ttl=60m
app.phone-otp.length=6
app.phone-otp.ttl=5m
app.phone-otp.max-attempts=5
app.phone-otp.resend-cooldown=60s

# Uploads land in target/ so they are wiped by `mvn clean`.
app.upload.dir=target/test-uploads
app.upload.max-file-size-bytes=8388608
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=24MB

# Seeded vehicle images (repo images/). Unused by tests, kept so the context resolves it.
app.images.root=../../images

# reCAPTCHA is disabled in tests so the suite never calls Google.
app.captcha.enabled=false
app.captcha.secret-key=test-secret

# ===============================
# SMTP (unused by tests, but the mail auto-config needs a host to build JavaMailSender)
# ===============================
app.mail.from=no-reply@ecomotion.test
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=

# ===============================
# SpringDoc / Swagger (kept enabled so the API docs contract is testable)
# ===============================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.fptufa26.ecomotion


# Map lookup settings are needed to create the application context in tests.
app.map.reverse-url=https://nominatim.openstreetmap.org/reverse
app.map.search-url=https://nominatim.openstreetmap.org/search
app.map.user-agent=EcoMotion-test/1.0
app.map.connect-timeout=5s
app.map.request-timeout=8s
